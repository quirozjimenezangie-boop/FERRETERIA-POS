<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Ferretería Central</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación del Sistema POS -->
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-wrench text-warning me-2"></i>FERRETERÍA CENTRAL - POS
            </a>
            <div class="text-white">
                <small><i class="fa-solid fa-user me-1"></i> Cajero: <strong>Ana López</strong></small>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Mostrador POS -->
    <div class="container-fluid my-4">
        <div class="row g-3">
            <!-- Columna Izquierda: Búsqueda y Carrito -->
            <div class="col-lg-8">
                <!-- Tarjeta de Búsqueda / Código de Barras -->
                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <label for="buscarSku" class="form-label fw-semibold text-secondary">
                            <i class="fa-solid fa-barcode me-1"></i> Búsqueda SKU / Código de Barras
                        </label>
                        <div class="input-group input-group-lg">
                            <input type="text" id="buscarSku" class="form-control" placeholder="Escanee o ingrese código (Ej: TORN-38)..." autofocus>
                            <button class="btn btn-warning fw-bold px-4 text-dark" type="button">
                                <i class="fa-solid fa-plus me-1"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Productos en Caja -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title m-0 fw-bold text-secondary">
                            <i class="fa-solid fa-cart-shopping me-2"></i>Detalle de la Venta Actual
                        </h5>
                    </div>
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>SKU</th>
                                    <th>Descripción del Artículo</th>
                                    <th class="text-center" style="width: 120px;">Cant.</th>
                                    <th class="text-end">P. Unitario</th>
                                    <th class="text-end">Subtotal</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><code>TORN-38</code></td>
                                    <td>Tornillo de Acero Galvanizado 3/8"</td>
                                    <td class="text-center">
                                        <input type="number" class="form-control form-control-sm text-center" value="10" min="1">
                                    </td>
                                    <td class="text-end">$2,500</td>
                                    <td class="text-end">$25,000</td>
                                    <td class="text-center">
                                        <button class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Resumen y Cobro -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3 text-secondary">Resumen de Cuenta</h5>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <strong>$21,008</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>IVA (19%):</span>
                            <strong>$3,992</strong>
                        </div>

                        <!-- Visor de Total con alta visibilidad (WCAG AA) -->
                        <div class="p-3 bg-light border rounded mb-4 text-end">
                            <span class="text-muted small text-uppercase fw-bold d-block">Total a Pagar</span>
                            <span class="fs-2 fw-bold text-success">$25,000</span>
                        </div>

                        <!-- Botón de Cobro Ergonómico -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-warning btn-lg fw-bold py-3 shadow-sm text-dark" type="button">
                                <i class="fa-solid fa-credit-card me-2"></i> COBRAR (F1)
                            </button>
                            <button class="btn btn-outline-secondary btn-lg py-2" type="button">
                                <i class="fa-solid fa-ban me-2"></i> Cancelar Venta
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
