<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Ferretería Central</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación del Sistema POS -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-wrench text-warning me-2"></i>FERRETERÍA CENTRAL - POS
            </a>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mt-4">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <div class="container-fluid py-3">
                <h1 class="display-5 fw-bold text-secondary">Módulo de Mostrador</h1>
                <p class="col-md-8 fs-4">Sistema de punto de venta e inventario en desarrollo con Bootstrap.</p>
                <button class="btn btn-warning btn-lg fw-bold" type="button">
                    <i class="fa-solid fa-cash-register me-2"></i> COBRAR (F1)
                </button>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
